# Generate the Xcode project with:  xcodegen generate
name: WorldTest
options:
  bundleIdPrefix: dev.worldtest
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.35.1
targets:
  WorldTest:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: WorldTest/Sources
      - path: WorldTest/Resources
        excludes:
          - glyphs
          - glyphs/**
          - landmarks
          - landmarks/**
      - path: WorldTest/Resources/glyphs
        type: folder
        buildPhase: resources
      # One folder per landmark model: <slug>/<slug>.glb and <slug>/facts.json (anchor).
      - path: WorldTest/Resources/landmarks
        type: folder
        buildPhase: resources
      - path: Config
        buildPhase: none
    dependencies:
      - package: MapLibre
      - package: MapboxMaps
    info:
      path: WorldTest/Info.plist
      properties:
        CFBundleDisplayName: World Test
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.worldtest.app
        PRODUCT_NAME: WorldTest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  WorldTest:
    build:
      targets:
        WorldTest: all
    run:
      config: Debug
    archive:
      config: Release
